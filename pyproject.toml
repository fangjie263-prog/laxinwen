[project]
name = "laxinwen"
version = "0.1.0"
description = "个人金融新闻采集与研究数据库（Personal financial news collection & research database）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    "trafilatura>=1.12.0",
    "selectolax>=0.3.21",
    "PyYAML>=6.0.1",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
news = "news.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/news"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: 需要外部网络访问的在线测试（默认跳过）",
]

[tool.uv]
package = true
